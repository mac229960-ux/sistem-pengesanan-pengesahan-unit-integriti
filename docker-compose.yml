# Pemasangan di server MBSP:  cp .env.docker.example .env.docker  → isi nilai (APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD, MAIL_*)
#                              docker compose --env-file .env.docker up -d --build
services:
  app:
    build: .
    image: mbsp/sistem-integriti:latest
    env_file: .env.docker
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storan:/var/www/html/storage/app
      - log:/var/www/html/storage/logs
    depends_on:
      - db
    restart: unless-stopped

  # Penjadual: peringatan SLA harian dan pembersihan OTP
  penjadual:
    image: mbsp/sistem-integriti:latest
    env_file: .env.docker
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storan:/var/www/html/storage/app
      - log:/var/www/html/storage/logs
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-integriti}
      MYSQL_USER: ${DB_USERNAME:-integriti}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Tetapkan DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Tetapkan DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  storan:
  log:
  mysql:
